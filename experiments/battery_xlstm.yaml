dataset:
  name: battery_dataset_generator
  kwargs:
    train_file_path: "data/lg_train.csv"
    test_file_path: "data/lg_test.csv"
    seq_len: 256
    pred_len: 1
    target_column: "Voltage"
    feature_columns: ["Current", "Temp", "SOC"]
    val_split_percent: 0.20

test_dataset:
  kwargs:
    file_path: "data/lg_test.csv"
    seq_len: 256
    pred_len: 1
    target_column: "Voltage"
    feature_columns: ["Current", "Temp", "SOC"]

model:
  # --- Parameters for xLSTMRegressionModelConfig ---
  input_dim: 3      # Number of input features (Current, Temp, SOC)
  output_dim: 1     # Number of output features (Voltage)

  # --- Parameters inherited from xLSTMBlockStackConfig ---
  embedding_dim: 64  # Dimension after input projection / internal dimension
  num_blocks: 2       # Total number of xLSTM blocks
  context_length: 256 # Should match dataset seq_len

  # Configure mLSTM blocks (used when slstm_at doesn't specify the block index)
  mlstm_block:
    mlstm:
      conv1d_kernel_size: 4
      qkv_proj_blocksize: 4
      num_heads: 2        # Note: This num_heads is for mLSTM internal mechanism

  # Configure sLSTM blocks (used when slstm_at *does* specify the block index)
  slstm_block:
    slstm:
      # backend: 'cuda' # or 'vanilla' - Use 'cuda' if available and compiled
      backend: 'vanilla' # Start with vanilla for broader compatibility
      num_heads: 2          # Number of sLSTM heads
      conv1d_kernel_size: 8
      bias_init: powerlaw_blockdependent # Or other init strategy
    feedforward: # Feedforward layer within the sLSTM block
      proj_factor: 1.3
      act_fn: gelu

  slstm_at: [1]         # Place an sLSTM block at index 1 (0-indexed)

  # Other optional xLSTMBlockStackConfig parameters (defaults shown):
  # add_post_blocks_norm: True
  # bias: False
  # dropout: 0.0

training:
  seed: 2000
  batch_size: 100
  max_epochs: 100                # Max epochs to train for
  early_stopping_patience: 20    # Stop if val_loss doesn't improve for this many epochs
  num_workers: 4  # Set number of CPU workers for data loading

  # --- Option 1: StepLR ---
  # Uncomment this block to use StepLR
  lr_scheduler_type: StepLR
  lr_step_size: 15                 # Reduce LR every this many epochs
  lr_gamma: 0.4                    # Multiply LR by this factor when reducing

  # --- Option 2: ReduceLROnPlateau (Default if Option 1 is commented) ---
  # Uncomment this block (and comment Option 1) to use ReduceLROnPlateau
  # lr_scheduler_type: ReduceLROnPlateau
  # lr_scheduler_patience: 3       # Reduce LR if val_loss doesn't improve for this many epochs
  # lr_factor: 0.1                 # Multiply LR by this factor when reducing (ReduceLROnPlateau)

  # --- Common Training Parameters ---
  lr: 0.0005                     # Initial learning rate
  weight_decay: 0.01
  enable_mixed_precision: true
  device: "cuda:0"
  weight_precision: float32
  amp_precision: bfloat16
  # lr_decay_factor: 0.1 # This is legacy from the previous step-based scheduler, can be removed
